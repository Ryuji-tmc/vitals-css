<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vitals.css — KPI/BIダッシュボード演出デモ</title>
<link rel="stylesheet" href="../vitals.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d14;
    color: #e6e8ef;
    padding: 32px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #8b8fa3; margin-bottom: 28px; font-size: 0.9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: #12141d;
    border: 1px solid #22243030;
    border-radius: 14px;
    padding: 20px;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8b8fa3;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .big-number {
    font-size: 2.2rem;
    font-weight: 700;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .vt-gauge { --vt-gauge-bg: #12141d; margin: 0 auto; }
  .bars-wrap { height: 90px; }
  .vt-bar { background: linear-gradient(180deg, #818cf8, #6366f1); }
  .rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .rank-row { display: flex; justify-content: space-between; padding: 8px 10px; background: #1a1c27; border-radius: 8px; }
  .replay-btn {
    margin-top: 24px;
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .replay-btn:hover { background: #4f52e0; }
</style>
</head>
<body>

<h1>vitals.css</h1>
<p class="sub">CSSのみ・依存ゼロの軽量KPI/BI演出ライブラリ。監査5分、コピペで導入。</p>

<div class="grid" data-vt-stagger>

  <div class="card">
    <h2><span class="vt-live-dot"></span> 月間売上</h2>
    <div class="big-number vt-counter" id="counter1">0</div>
    <div class="vt-trend up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 15l7-7 7 7"/></svg>
      前月比 +12.4%
    </div>
  </div>

  <div class="card">
    <h2>目標達成率</h2>
    <div class="vt-gauge" id="gauge1">
      <span class="vt-gauge-label" id="gaugeLabel1">0%</span>
    </div>
  </div>

  <div class="card vt-alert">
    <h2>エラー率(しきい値超過)</h2>
    <div class="big-number" style="color:var(--vt-warn)">4.8%</div>
    <div class="vt-trend down">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l7 7 7-7"/></svg>
      閾値(3%)超過中
    </div>
  </div>

  <div class="card">
    <h2>週次アクティブ数</h2>
    <div class="bars-wrap vt-bar-grow">
      <div class="vt-bar" style="--i:0; height:40%"></div>
      <div class="vt-bar" style="--i:1; height:65%"></div>
      <div class="vt-bar" style="--i:2; height:50%"></div>
      <div class="vt-bar" style="--i:3; height:80%"></div>
      <div class="vt-bar" style="--i:4; height:95%"></div>
      <div class="vt-bar" style="--i:5; height:70%"></div>
    </div>
  </div>

  <div class="card">
    <h2>直近30日トレンド</h2>
    <svg class="vt-sparkline" viewBox="0 0 200 60" width="100%" height="70">
      <path d="M0,45 L20,40 L40,42 L60,30 L80,35 L100,20 L120,25 L140,15 L160,18 L180,8 L200,10"
            fill="none" stroke="#22c55e" stroke-width="3" id="sparkPath"/>
    </svg>
  </div>

  <div class="card">
    <h2>担当者別ランキング</h2>
    <ul class="rank-list" id="rankList">
      <li class="rank-row vt-rank-row" data-id="a"><span>田中</span><span>¥820,000</span></li>
      <li class="rank-row vt-rank-row" data-id="b"><span>佐藤</span><span>¥760,000</span></li>
      <li class="rank-row vt-rank-row" data-id="c"><span>鈴木</span><span>¥690,000</span></li>
    </ul>
  </div>

</div>

<button class="replay-btn" id="replayBtn">アニメーションをもう一度再生</button>

<script src="../vitals.js"></script>
<script>
  function playAll() {
    Vitals.animateCounter(document.getElementById('counter1'), {
      to: 4820000, duration: 1400, format: (n) => '¥' + Math.round(n).toLocaleString()
    });

    const gauge = document.getElementById('gauge1');
    const label = document.getElementById('gaugeLabel1');
    Vitals.setGauge(gauge, 0);
    requestAnimationFrame(() => Vitals.setGauge(gauge, 78));
    Vitals.animateCounter(label, { to: 78, duration: 1200, format: (n) => Math.round(n) + '%' });

    Vitals.drawSparkline(document.getElementById('sparkPath'));

    document.querySelectorAll('.vt-bar').forEach((b) => {
      b.style.animation = 'none';
      void b.offsetWidth;
      b.style.animation = '';
    });

    const stagger = document.querySelector('[data-vt-stagger]');
    stagger.classList.remove('is-visible');
    void stagger.offsetWidth;
    [...stagger.children].forEach((child, i) => child.style.setProperty('--i', i));
    stagger.classList.add('is-visible');
  }

  Vitals.initStagger();
  window.addEventListener('load', () => setTimeout(playAll, 150));
  document.getElementById('replayBtn').addEventListener('click', playAll);

  // ランキングのランダム並び替えデモ(FLIP)
  let rankData = [
    { id: 'a', name: '田中', amount: 820000 },
    { id: 'b', name: '佐藤', amount: 760000 },
    { id: 'c', name: '鈴木', amount: 690000 },
  ];
  setInterval(() => {
    rankData = rankData.map((r) => ({ ...r, amount: r.amount + Math.floor((Math.random() - 0.3) * 50000) }));
    rankData.sort((a, b) => b.amount - a.amount);
    const list = document.getElementById('rankList');
    const rows = [...list.children];
    Vitals.flipReorder(rows, () => {
      rankData.forEach((r) => {
        const row = rows.find((el) => el.dataset.id === r.id);
        row.querySelector('span:last-child').textContent = '¥' + r.amount.toLocaleString();
        list.appendChild(row);
      });
    });
  }, 4000);
</script>
</body>
</html>
