<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vitals. → ものと情報の流れ</title>
<style>
  :root {
    --bg: #0b0d14;
    --sub: #8b8fa3;
    --a1: #818cf8;
    --a2: #a855f7;
    --blue: #3b82f6;
    --red: #ef4444;
    --yellow: #eab308;
    --cycle: 11s;
  }
  @font-face {
    font-family: 'HachiMaruPop';
    src: url('../fonts/HachiMaruPop-Regular.ttf') format('truetype');
    font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .stage { width: min(94vw, 720px); }
  svg { width: 100%; height: auto; overflow: visible; }
  text { font-family: 'HachiMaruPop', "Hiragino Maru Gothic ProN", sans-serif; font-weight: 400; }

  /* ================= 1. vitals. ロゴ(前半) ================= */
  .icon-path {
    fill: none; stroke: url(#gradAccent); stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100;
    animation: icon-draw var(--cycle) infinite;
  }
  @keyframes icon-draw {
    0%   { stroke-dashoffset: 100; opacity: 1; transform: scale(1); }
    8%   { stroke-dashoffset: 0;   opacity: 1; transform: scale(1); }
    12%  { stroke-dashoffset: 0;   opacity: 1; transform: scale(1); }
    16%  { stroke-dashoffset: 0;   opacity: 0; transform: scale(0.85); }
    100% { stroke-dashoffset: 0;   opacity: 0; transform: scale(0.85); }
  }

  .wordmark {
    font-family: "Segoe Script", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
    font-size: 60px; fill: url(#gradAccent);
    opacity: 0; filter: blur(6px);
    animation: word-settle var(--cycle) infinite;
  }
  @keyframes word-settle {
    0%, 12%   { opacity: 0;   filter: blur(6px); transform: translate(0px,0px) rotate(0deg); }
    14%       { opacity: 0.5; filter: blur(4px); transform: translate(-6px,4px) rotate(-4deg); }
    15.5%     { opacity: 0.8; filter: blur(2px); transform: translate(5px,-3px) rotate(3deg); }
    17%       { opacity: 1;   filter: blur(0px); transform: translate(-2px,2px) rotate(-1deg); }
    18%, 36%  { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    40%, 100% { opacity: 0;   filter: blur(3px); transform: translate(0px,6px) rotate(1deg); }
  }

  .arc-path {
    fill: none; stroke: var(--a2); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: arc-draw var(--cycle) infinite;
  }
  @keyframes arc-draw {
    0%, 17%   { stroke-dashoffset: 100; opacity: 0; }
    22%       { stroke-dashoffset: 0;   opacity: 1; }
    36%       { stroke-dashoffset: 0;   opacity: 1; }
    40%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  .tick {
    stroke: var(--a1); stroke-width: 3; stroke-linecap: round;
    opacity: 0; transform-origin: center;
    animation: tick-pop var(--cycle) infinite;
  }
  @keyframes tick-pop {
    0%, 20%   { opacity: 0; transform: scale(0.4); }
    24%       { opacity: 1; transform: scale(1.15); }
    26%, 36%  { opacity: 1; transform: scale(1); }
    40%, 100% { opacity: 0; transform: scale(0.4); }
  }

  .pulse-dot { opacity: 0; animation: dot-appear var(--cycle) infinite; }
  @keyframes dot-appear {
    0%, 17%   { opacity: 0; }
    20%, 36%  { opacity: 1; }
    40%, 100% { opacity: 0; }
  }
  .pulse-dot circle { animation: dot-beat 1.1s ease-in-out infinite; transform-origin: center; }
  @keyframes dot-beat {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.6); }
    50% { transform: scale(1); }
  }

  .subtitle {
    font-size: 14px; letter-spacing: 0.25em; fill: var(--sub); text-transform: uppercase;
    opacity: 0; animation: sub-fade var(--cycle) infinite;
  }
  @keyframes sub-fade {
    0%, 22%   { opacity: 0; transform: translateY(8px); }
    28%, 36%  { opacity: 1; transform: translateY(0px); }
    40%, 100% { opacity: 0; transform: translateY(6px); }
  }

  /* ================= 2. ものと情報の流れ(後半) ================= */

  /* ---- 2a. もの・情報 = 手書き定着(vitalsロゴと同じ技法) ---- */
  .w-mono, .w-joho {
    font-weight: 400;
    filter: blur(6px);
    opacity: 0;
  }
  .w-mono { fill: var(--blue); }
  .w-joho { fill: var(--red); }

  .w-mono { animation: flow-settle-a var(--cycle) infinite; }
  @keyframes flow-settle-a {
    0%, 40%   { opacity: 0;   filter: blur(6px); transform: translate(-6px,4px) rotate(-4deg); }
    42%       { opacity: 0.6; filter: blur(3px); transform: translate(4px,-3px) rotate(3deg); }
    44%       { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    44%, 90%  { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    96%, 100% { opacity: 0;   filter: blur(2px); transform: translate(0px,4px) rotate(1deg); }
  }

  .w-joho { animation: flow-settle-joho var(--cycle) infinite; }
  @keyframes flow-settle-joho {
    0%, 46%   { opacity: 0;   filter: blur(6px); transform: translate(-6px,4px) rotate(-4deg); }
    48%       { opacity: 0.6; filter: blur(3px); transform: translate(4px,-3px) rotate(3deg); }
    50%       { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    50%, 90%  { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    96%, 100% { opacity: 0;   filter: blur(2px); transform: translate(0px,4px) rotate(1deg); }
  }

  /* ---- 2b. と・の・流れ = 白地+黒枠のアウトライン描画 → 塗りつぶし(VRoid Studio風の技法) ---- */
  .w-to, .w-no, .w-nagare {
    font-weight: 400;
    stroke: #111318;
    stroke-width: 1.4;
    paint-order: stroke fill;
    opacity: 0;
  }
  .w-to, .w-no  { animation: outline-fill-yellow var(--cycle) infinite; }
  .w-nagare     { animation: outline-fill-blue var(--cycle) infinite; }

  @keyframes outline-fill-yellow {
    0%, 53%   { opacity: 0; fill: #ffffff; }
    55%       { opacity: 1; fill: #ffffff; }
    60%, 90%  { opacity: 1; fill: var(--yellow); }
    96%, 100% { opacity: 0; fill: var(--yellow); }
  }
  @keyframes outline-fill-blue {
    0%, 53%   { opacity: 0; fill: #ffffff; }
    55%       { opacity: 1; fill: #ffffff; }
    60%, 90%  { opacity: 1; fill: var(--blue); }
    96%, 100% { opacity: 0; fill: var(--blue); }
  }

  /* スウォッシュ(斜めの装飾線、塗りつぶしと同時に駆け抜ける) */
  .swoosh {
    fill: none; stroke: #cbd0dc; stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: swoosh-draw var(--cycle) infinite;
  }
  @keyframes swoosh-draw {
    0%, 53%   { stroke-dashoffset: 100; opacity: 0; }
    58%       { stroke-dashoffset: 0;   opacity: 1; }
    64%, 90%  { stroke-dashoffset: 0;   opacity: 0; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  .flow-icon-mono > * {
    fill: none; stroke: var(--blue); stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: icon-draw-mono var(--cycle) infinite;
  }
  @keyframes icon-draw-mono {
    0%, 41%   { stroke-dashoffset: 100; opacity: 0; }
    47%       { stroke-dashoffset: 0;   opacity: 1; }
    90%       { stroke-dashoffset: 0;   opacity: 1; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  .flow-icon-info > * {
    fill: none; stroke: var(--red); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: icon-draw-info var(--cycle) infinite;
  }
  @keyframes icon-draw-info {
    0%, 47%   { stroke-dashoffset: 100; opacity: 0; }
    53%       { stroke-dashoffset: 0;   opacity: 1; }
    90%       { stroke-dashoffset: 0;   opacity: 1; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .icon-path { opacity: 0; }
    .wordmark, .arc-path, .tick, .pulse-dot, .subtitle,
    .w-mono, .w-joho, .w-to, .w-no, .w-nagare, .swoosh,
    .flow-icon-mono > *, .flow-icon-info { opacity: 1; filter: none; transform: none; }
    .w-to, .w-no, .w-nagare { fill: var(--yellow); }
    .w-nagare { fill: var(--blue); }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--a1)"/>
        <stop offset="100%" stop-color="var(--a2)"/>
      </linearGradient>
    </defs>

    <!-- ===== シーン1: vitals. ロゴ ===== -->
    <path class="icon-path" pathLength="100"
      d="M220,150 L300,150 L322,105 L346,180 L366,120 L382,150 L540,150" />

    <path class="arc-path" pathLength="100" d="M210,130 Q245,35 285,120" />
    <path class="arc-path" pathLength="100" d="M475,120 Q515,35 550,130" />

    <g>
      <line class="tick" x1="174" y1="150" x2="192" y2="150" />
      <line class="tick" x1="172" y1="130" x2="188" y2="122" />
      <line class="tick" x1="172" y1="170" x2="188" y2="178" />
      <line class="tick" x1="586" y1="150" x2="568" y2="150" />
      <line class="tick" x1="588" y1="130" x2="572" y2="122" />
      <line class="tick" x1="588" y1="170" x2="572" y2="178" />
    </g>

    <text class="wordmark" x="380" y="150" text-anchor="middle">vitals.</text>
    <g class="pulse-dot"><circle cx="343" cy="96" r="7" fill="var(--a2)" /></g>
    <text class="subtitle" x="380" y="188" text-anchor="middle">CSS · Zero-Dependency Motion</text>

    <!-- ===== シーン2: ものと情報の流れ ===== -->

    <!-- トラック(もの=物流)アイコン: Lucide "truck" (ISC License) -->
    <g class="flow-icon-mono" transform="translate(178,18) scale(1.9)">
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" pathLength="100"/>
      <path d="M15 18H9" pathLength="100"/>
      <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" pathLength="100"/>
      <circle cx="17" cy="18" r="2" pathLength="100"/>
      <circle cx="7" cy="18" r="2" pathLength="100"/>
    </g>

    <!-- 波線(情報)アイコン: Lucide "waves" (ISC License) -->
    <g class="flow-icon-info" transform="translate(462,24) scale(1.4)">
      <path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      <path d="M2 19q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      <path d="M2 5q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
    </g>

    <!-- スウォッシュ(と・の・流れの塗りつぶしと連動する斜めの装飾線) -->
    <path class="swoosh" pathLength="100" d="M600,205 L640,120" />

    <text y="172">
      <tspan class="w-mono"   x="150" font-size="58">もの</tspan>
      <tspan class="w-to"     x="266" font-size="34" dy="8">と</tspan>
      <tspan class="w-joho"   x="300" dy="-8" font-size="58">情報</tspan>
      <tspan class="w-no"     x="416" dy="8" font-size="34">の</tspan>
      <tspan class="w-nagare" x="450" dy="-8" font-size="58">流れ</tspan>
    </text>
  </svg>
</div>
</body>
</html>
