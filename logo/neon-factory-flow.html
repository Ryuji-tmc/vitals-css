  :root {
    --void: #0b0221;
    --void-deep: #060114;
    --panel: rgba(23, 11, 52, 0.72);
    --cyan: #2fe8ff;
    --magenta: #ff2e9a;
    --yellow: #ffd84a;
    --ink: #eeeaff;
    --ink-soft: #a79fd6;
    --grid-line: #6f2dbd;
    --sun-top: #ff5f6d;
    --sun-mid: #ff8f6b;
    --sun-bottom: #ffd66b;
  }
  /* このデザインは80年代シンセウェイブ/近未来工場の世界観に一意にコミットしているため単一テーマ */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--void);
    color: var(--ink);
    font-family: 'Plex JP', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 980px;
    aspect-ratio: 16 / 11;
    margin: 24px;
    border-radius: 10px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 120% 90% at 50% 8%, rgba(255,143,107,0.18), transparent 60%),
      linear-gradient(180deg, var(--void-deep) 0%, #100a2e 55%, #1c0f3f 100%);
    box-shadow: 0 0 0 1px rgba(111,45,189,0.4), 0 30px 80px -20px rgba(0,0,0,0.7);
  }

  /* 地平線の太陽 */
  .sun-wrap { position:absolute; left:50%; top:14%; width:220px; height:220px; transform:translateX(-50%); overflow:hidden; border-radius:50%; opacity:0; }
  .sun { position:absolute; inset:0; border-radius:50%; background: linear-gradient(180deg, var(--sun-top) 0%, var(--sun-mid) 45%, var(--sun-bottom) 100%); }
  .sun-stripe { position:absolute; left:0; right:0; height:6px; background: var(--void-deep); }

  /* 低ポリ工場シルエット */
  .skyline { position:absolute; left:0; right:0; top:37%; height:70px; opacity:0; }
  .skyline svg { width:100%; height:100%; display:block; }

  /* パースの床グリッド(収束線を明示したSVG) */
  .floor { position:absolute; left:0; right:0; bottom:0; top:40%; overflow:hidden; opacity:0; }
  .floor svg { width:100%; height:100%; display:block; }
  .floor .grid-line { stroke: var(--grid-line); stroke-width: 1.2; opacity: 0.75; }
  .floor .grid-glow { stroke: var(--grid-line); stroke-width: 3; opacity: 0.25; filter: blur(2px); }
  .floor .h-line { animation: h-glow 2.4s ease-in-out infinite; }
  @keyframes h-glow { 0%,100%{opacity:.75} 50%{opacity:.4} }

  /* スキャンライン(CRT質感) */
  .scanlines {
    position:absolute; inset:0; pointer-events:none; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 3px);
    opacity: .5;
  }
  .vignette { position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 140px 40px rgba(6,1,20,0.85); }

  /* コンテンツ */
  .content { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding: 22px clamp(18px,4vw,40px) 26px; }

  .hud-row { display:flex; align-items:center; gap:10px; margin-bottom: 8px; opacity:0; }
  .dot { width:7px; height:7px; border-radius:50%; background: var(--cyan); box-shadow: 0 0 8px 2px var(--cyan); animation: blink 1.6s ease-in-out infinite; }
  .hud-label { font-family:'Orbitron'; font-weight:700; font-size: 11px; letter-spacing:.16em; color: var(--ink-soft); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .title {
    font-family: 'MPlus Black'; font-weight:900;
    font-size: clamp(34px, 6.6vw, 58px); line-height:1.05;
    margin: 0 0 20px; text-wrap: balance;
    opacity: 0;
  }
  .t-mono { color: var(--cyan); text-shadow: 0 0 6px var(--cyan), 0 0 22px rgba(47,232,255,0.65), 0 0 46px rgba(47,232,255,0.35); }
  .t-info { color: var(--magenta); text-shadow: 0 0 6px var(--magenta), 0 0 22px rgba(255,46,154,0.65), 0 0 46px rgba(255,46,154,0.35); }
  .t-conn { color: var(--yellow); font-size:.55em; margin:0 1px; text-shadow: 0 0 6px var(--yellow), 0 0 16px rgba(255,216,74,0.6); }

  .panels { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid rgba(111,45,189,0.55);
    border-radius: 8px;
    padding: 14px 16px;
    backdrop-filter: blur(3px);
    opacity: 0;
  }
  .panel.material { box-shadow: 0 0 0 1px rgba(47,232,255,0.18), 0 0 24px -6px rgba(47,232,255,0.35); }
  .panel.info { box-shadow: 0 0 0 1px rgba(255,46,154,0.18), 0 0 24px -6px rgba(255,46,154,0.35); }

  .panel-head { display:flex; align-items:center; gap:8px; margin-bottom: 10px; }
  .panel-icon { width:20px; height:20px; flex-shrink:0; }
  .panel.material .panel-icon { color: var(--cyan); filter: drop-shadow(0 0 4px rgba(47,232,255,0.8)); }
  .panel.info .panel-icon { color: var(--magenta); filter: drop-shadow(0 0 4px rgba(255,46,154,0.8)); }
  .panel-icon svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .panel-name { font-family:'Orbitron'; font-weight:700; font-size:11px; letter-spacing:.12em; color: var(--ink-soft); }

  .steps { display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-family:'Plex JP'; font-weight:500; font-size:12px; color: var(--ink); margin-bottom: 10px; }
  .steps .chip { border:1px solid rgba(238,234,255,0.25); border-radius:4px; padding:2px 7px; background:rgba(238,234,255,0.04); }
  .steps .arrow { color: var(--ink-soft); }

  .metric { display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid rgba(238,234,255,0.15); padding-top:8px; }
  .metric .name { font-family:'Plex JP'; font-size:11px; color: var(--ink-soft); }
  .metric .value { font-family:'Orbitron'; font-weight:900; font-size:18px; font-variant-numeric: tabular-nums; }
  .panel.material .metric .value { color: var(--cyan); text-shadow: 0 0 8px rgba(47,232,255,0.7); }
  .panel.info .metric .value { color: var(--magenta); text-shadow: 0 0 8px rgba(255,46,154,0.7); }

  @media (prefers-reduced-motion: reduce) {
    .floor-grid { animation: none; }
    .dot { animation: none; }
    .sun-wrap, .skyline, .floor, .hud-row, .title, .panel { opacity: 1 !important; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .sun-wrap { animation: rise 1.1s .1s cubic-bezier(.2,.8,.2,1) forwards; }
    .skyline { animation: fade-in .8s .5s ease forwards; }
    .floor { animation: fade-in 1s .3s ease forwards; }
    .hud-row { animation: fade-in .5s .9s ease forwards; }
    .title { animation: flicker-in 1s 1.1s steps(1) forwards; }
    .panel.material { animation: rise-in .6s 1.9s cubic-bezier(.2,.8,.2,1) forwards; }
    .panel.info { animation: rise-in .6s 2.1s cubic-bezier(.2,.8,.2,1) forwards; }
  }
  @keyframes rise { from{opacity:0; transform:translate(-50%,14px)} to{opacity:1; transform:translate(-50%,0)} }
  @keyframes fade-in { to { opacity:1; } }
  @keyframes rise-in { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes flicker-in {
    0% { opacity:0; }
    8% { opacity:1; } 12% { opacity:.2; } 16% { opacity:1; }
    22% { opacity:.3; } 26% { opacity:1; }
    100% { opacity:1; }
  }
</style>
</head>
