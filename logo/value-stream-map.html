    --line: #2B333C; --line-strong: #3D4750;
    --grid: rgba(231,236,241,0.045); --shadow: rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --paper: #E7ECF1; --panel: #F4F6F8; --ink: #1C232B; --ink-soft: #55606B;
    --amber: #B85F19; --blue: #1F5C8B; --mustard: #93691C;
    --line: #B9C3CC; --line-strong: #8B98A3;
    --grid: rgba(28,35,43,0.05); --shadow: rgba(28,35,43,0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
      var(--paper);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    font-family: 'Plex JP', -apple-system, sans-serif;
    color: var(--ink);
  }

  .panel {
    position: relative;
    width: min(94vw, 860px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 40px clamp(24px, 4vw, 56px) 34px;
    box-shadow: 0 18px 40px -20px var(--shadow);
  }
  .corner {
    position: absolute; width: 16px; height: 16px;
    border: 2px solid var(--line-strong);
    opacity: .8;
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .eyebrow-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 30px;
  }
  .eyebrow {
    font-family: 'Stencil', sans-serif;
    font-size: 15px; letter-spacing: 0.22em;
    color: var(--ink-soft); white-space: nowrap;
  }
  .ruler { flex: 1; height: 10px; }
  .ruler svg { width: 100%; height: 100%; display:block; overflow:visible; }
  .ruler line { stroke: var(--line-strong); }
  .fig-tag {
    font-family: 'Plex JP'; font-weight: 600; font-size: 11px;
    letter-spacing: 0.1em; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 8px; white-space: nowrap;
  }

  .hero {
    font-family: 'MPlus Black';
    font-weight: 900;
    font-size: clamp(40px, 7vw, 68px);
    line-height: 1.05;
    margin: 0 0 34px;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .w-mono { color: var(--amber); }
  .w-info { color: var(--blue); }
  .w-conn { color: var(--mustard); font-size: 0.56em; margin: 0 1px; }

  .lanes { display: flex; flex-direction: column; gap: 22px; margin-bottom: 30px; }
  .lane { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px; }
  .lane-icon { width: 26px; height: 26px; flex-shrink: 0; }
  .lane-icon.end { width: 24px; height: 24px; }
  .lane-material .lane-icon, .lane-material .lane-label { color: var(--amber); }
  .lane-info .lane-icon, .lane-info .lane-label { color: var(--blue); }
  .lane-icon svg { width: 100%; height: 100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .lane-label {
    font-family: 'Plex JP'; font-weight: 600; font-size: 14px;
    white-space: nowrap;
  }

  .track { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 4px; overflow: hidden; }
  .track-line-el {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    transform: translateY(-50%) scaleX(0); transform-origin: left;
    background: var(--amber); opacity: .4;
  }
  .lane-info .track-line-el {
    background: repeating-linear-gradient(90deg, var(--blue) 0 6px, transparent 6px 12px);
    opacity: .6;
  }
  .flow-dot-el {
    position: absolute; top: 50%; left: 0; width: 6px; height: 6px;
    margin-top: -3px; border-radius: 50%; background: var(--amber);
    opacity: 0;
  }
  .lane-info .flow-dot-el { background: var(--blue); }
  .step {
    position: relative; z-index: 1;
    font-family: 'Plex JP'; font-weight: 500; font-size: 13px;
    background: var(--panel); padding: 2px 8px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 3px;
  }
  .arrow { position: relative; z-index: 1; color: var(--ink-soft); font-size: 13px; }

  .metric {
    font-family: 'Plex JP'; font-weight: 500; font-size: 13px;
    color: var(--ink-soft); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .metric b { font-weight: 600; color: var(--ink); }

  .caption {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    font-size: 13px; color: var(--ink-soft);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  @media (max-width: 560px) {
    .lane { grid-template-columns: auto 1fr; grid-template-areas: "icon label" "track track" "metric metric"; row-gap: 8px; }
    .lane-icon.end { display:none; }
    .metric { grid-area: metric; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .ruler-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.1s 0.1s cubic-bezier(.4,0,.2,1) forwards; }
    .hero span { display:inline-block; opacity:0; transform: translateY(10px); animation: rise .6s cubic-bezier(.2,.7,.3,1) forwards; }
    .hero span:nth-child(1){animation-delay:.35s} .hero span:nth-child(2){animation-delay:.42s}
    .hero span:nth-child(3){animation-delay:.49s} .hero span:nth-child(4){animation-delay:.56s}
    .hero span:nth-child(5){animation-delay:.63s}
    .lane { opacity:0; transform: translateY(6px); animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .lane-material { animation-delay: .95s; }
    .lane-info { animation-delay: 1.15s; }
    .caption { opacity:0; animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; animation-delay: 1.4s; }
    .track-line-el { animation: grow .7s cubic-bezier(.4,0,.2,1) forwards; }
    .lane-material .track-line-el { animation-delay: 1s; }
    .lane-info .track-line-el { animation-delay: 1.2s; }
    .flow-dot-el { animation: slide 3s linear infinite; }
    .lane-material .flow-dot-el { animation-delay: 1.7s; }
    .lane-info .flow-dot-el { animation-delay: 1.9s; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { to { opacity:1; transform:none; } }
  @keyframes grow { to { transform: translateY(-50%) scaleX(1); } }
  @keyframes slide { 0% { left:0%; opacity:0; } 8% { opacity:1; } 92% { opacity:1; } 100% { left:100%; opacity:0; } }
</style>
</head>
<body>
  <div class="panel">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <div class="eyebrow-row">
      <span class="eyebrow">VALUE STREAM MAP</span>
      <span class="ruler"><svg viewBox="0 0 100 10" preserveAspectRatio="none">
        <line class="ruler-draw" x1="0" y1="5" x2="100" y2="5" stroke-width="1" pathLength="1000"/>
      </svg></span>
      <span class="fig-tag">FIG. 01</span>
    </div>

    <h1 class="hero">
      <span class="w-mono">もの</span><span class="w-conn">と</span><span class="w-info">情報</span><span class="w-conn">の</span><span class="w-mono">流れ</span>
    </h1>

    <div class="lanes">
      <div class="lane lane-material">
        <span class="lane-icon">
          <svg viewBox="0 0 24 24"><path d="M12 16h.01"/><path d="M16 16h.01"/><path d="M3 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a.5.5 0 0 0-.769-.422l-4.462 2.844A.5.5 0 0 1 15 10.5v-2a.5.5 0 0 0-.769-.422L9.77 10.922A.5.5 0 0 1 9 10.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M8 16h.01"/></svg>
        </span>
        <div class="track">
          <div class="track-line-el"></div>
          <div class="flow-dot-el"></div>
          <span class="step">原材料</span><span class="arrow">→</span>
          <span class="step">加工</span><span class="arrow">→</span>
          <span class="step">出荷</span>
        </div>
        <span class="lane-icon end">
          <svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
        </span>
        <span class="metric">タクトタイム <b>45</b>秒</span>
      </div>

      <div class="lane lane-info">
        <span class="lane-icon">
          <svg viewBox="0 0 24 24"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"/></svg>
        </span>
        <div class="track">
          <div class="track-line-el"></div>
          <div class="flow-dot-el"></div>
          <span class="step">受注</span><span class="arrow">→</span>
          <span class="step">生産指示</span><span class="arrow">→</span>
          <span class="step">かんばん</span>
        </div>
        <span class="lane-icon end">
          <svg viewBox="0 0 24 24"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"/></svg>
        </span>
        <span class="metric">リードタイム <b>3</b>日</span>
      </div>
    </div>

    <div class="caption">
      <span>モノと情報、二つの流れを一枚で可視化する。</span>
      <span>SHOP FLOOR / OFFICE</span>
    </div>
  </div>
</body>
