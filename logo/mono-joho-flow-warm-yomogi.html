<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ものと情報の流れ(暖色・Yomogiフォント)</title>
<style>
  :root {
    --bg: #fdf6ec;
    --ink: #4a4038;
    --blue: #5b7fd6;
    --red: #e8695a;
    --yellow: #dda029;
    --cycle: 11s;
  }
  @font-face {
    font-family: 'Yomogi';
    src: url('../fonts/Yomogi-Regular.ttf') format('truetype');
    font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .stage { width: min(94vw, 720px); }
  svg { width: 100%; height: auto; overflow: visible; }
  text {
    font-family: 'Yomogi', "Hiragino Maru Gothic ProN", sans-serif;
    font-weight: 400;
  }

  /* ---- 装飾フレーム(アーチ+ひげ状ティック+花のワンポイント) ---- */
  .cat-arc {
    fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: frame-draw var(--cycle) infinite;
  }
  .whisker {
    stroke: var(--ink); stroke-width: 2; stroke-linecap: round;
    opacity: 0; transform-origin: center;
    animation: frame-pop var(--cycle) infinite;
  }
  @keyframes frame-draw {
    0%, 40%   { stroke-dashoffset: 100; opacity: 0; }
    46%       { stroke-dashoffset: 0;   opacity: 0.75; }
    90%       { stroke-dashoffset: 0;   opacity: 0.75; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }
  @keyframes frame-pop {
    0%, 40%   { opacity: 0; transform: scale(0.4); }
    46%       { opacity: 0.75; transform: scale(1.1); }
    48%, 90%  { opacity: 0.75; transform: scale(1); }
    96%, 100% { opacity: 0; transform: scale(0.4); }
  }

  .flower { opacity: 0; animation: flower-appear var(--cycle) infinite; transform-origin: center; }
  @keyframes flower-appear {
    0%, 48%  { opacity: 0; transform: scale(0.5) rotate(-20deg); }
    52%      { opacity: 1; transform: scale(1) rotate(0deg); }
    52%, 90% { opacity: 1; }
    96%,100% { opacity: 0; }
  }
  .flower g { animation: flower-sway 2.4s ease-in-out infinite; transform-origin: center; }
  @keyframes flower-sway {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50%      { transform: rotate(4deg) scale(1.06); }
  }

  /* ---- もの・情報 = 手書き定着 ---- */
  .w-mono, .w-joho { filter: blur(6px); opacity: 0; }
  .w-mono { fill: var(--blue); }
  .w-joho { fill: var(--red); }

  .w-mono { animation: flow-settle-a var(--cycle) infinite; }
  @keyframes flow-settle-a {
    0%, 40%   { opacity: 0;   filter: blur(6px); transform: translate(-6px,4px) rotate(-4deg); }
    42%       { opacity: 0.6; filter: blur(3px); transform: translate(4px,-3px) rotate(3deg); }
    44%       { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    44%, 90%  { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    96%, 100% { opacity: 0;   filter: blur(2px); transform: translate(0px,4px) rotate(1deg); }
  }

  .w-joho { animation: flow-settle-joho var(--cycle) infinite; }
  @keyframes flow-settle-joho {
    0%, 46%   { opacity: 0;   filter: blur(6px); transform: translate(-6px,4px) rotate(-4deg); }
    48%       { opacity: 0.6; filter: blur(3px); transform: translate(4px,-3px) rotate(3deg); }
    50%       { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    50%, 90%  { opacity: 1;   filter: blur(0px); transform: translate(0px,0px) rotate(0deg); }
    96%, 100% { opacity: 0;   filter: blur(2px); transform: translate(0px,4px) rotate(1deg); }
  }

  /* ---- と・の・流れ = アウトライン描画 → 塗りつぶし ---- */
  .w-to, .w-no, .w-nagare {
    stroke: var(--ink); stroke-width: 1.4; paint-order: stroke fill; opacity: 0;
  }
  .w-to, .w-no { animation: outline-fill-yellow var(--cycle) infinite; }
  .w-nagare    { animation: outline-fill-blue var(--cycle) infinite; }

  @keyframes outline-fill-yellow {
    0%, 53%   { opacity: 0; fill: #fffaf1; }
    55%       { opacity: 1; fill: #fffaf1; }
    60%, 90%  { opacity: 1; fill: var(--yellow); }
    96%, 100% { opacity: 0; fill: var(--yellow); }
  }
  @keyframes outline-fill-blue {
    0%, 53%   { opacity: 0; fill: #fffaf1; }
    55%       { opacity: 1; fill: #fffaf1; }
    60%, 90%  { opacity: 1; fill: var(--blue); }
    96%, 100% { opacity: 0; fill: var(--blue); }
  }

  .swoosh {
    fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: swoosh-draw var(--cycle) infinite;
  }
  @keyframes swoosh-draw {
    0%, 53%   { stroke-dashoffset: 100; opacity: 0; }
    58%       { stroke-dashoffset: 0;   opacity: 0.6; }
    64%, 90%  { stroke-dashoffset: 0;   opacity: 0; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  .flow-icon-mono > * {
    fill: none; stroke: var(--blue); stroke-width: 2.6;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: icon-draw-mono var(--cycle) infinite;
  }
  @keyframes icon-draw-mono {
    0%, 41%   { stroke-dashoffset: 100; opacity: 0; }
    47%       { stroke-dashoffset: 0;   opacity: 1; }
    90%       { stroke-dashoffset: 0;   opacity: 1; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  .flow-icon-info > * {
    fill: none; stroke: var(--red); stroke-width: 2.1;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    animation: icon-draw-info var(--cycle) infinite;
  }
  @keyframes icon-draw-info {
    0%, 47%   { stroke-dashoffset: 100; opacity: 0; }
    53%       { stroke-dashoffset: 0;   opacity: 1; }
    90%       { stroke-dashoffset: 0;   opacity: 1; }
    96%, 100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .cat-arc, .whisker, .flower { opacity: 0.75; }
    .w-mono, .w-joho, .w-to, .w-no, .w-nagare,
    .flow-icon-mono > *, .flow-icon-info > * { opacity: 1; filter: none; transform: none; }
    .w-to, .w-no { fill: var(--yellow); }
    .w-nagare { fill: var(--blue); }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">

    <!-- 装飾フレーム: アーチ(耳)+ひげ状ティック -->
    <path class="cat-arc" pathLength="100" d="M230,150 Q290,30 350,140" />
    <path class="cat-arc" pathLength="100" d="M410,140 Q470,30 530,150" />
    <g>
      <line class="whisker" x1="150" y1="165" x2="200" y2="160" />
      <line class="whisker" x1="150" y1="180" x2="202" y2="182" />
      <line class="whisker" x1="150" y1="195" x2="200" y2="204" />
      <line class="whisker" x1="610" y1="160" x2="560" y2="165" />
      <line class="whisker" x1="608" y1="182" x2="558" y2="180" />
      <line class="whisker" x1="610" y1="204" x2="560" y2="195" />
    </g>

    <!-- 花のワンポイント -->
    <g class="flower" transform="translate(380,95)">
      <g>
        <circle cx="0" cy="-11" r="6" fill="var(--yellow)"/>
        <circle cx="0" cy="11" r="6" fill="var(--yellow)"/>
        <circle cx="-11" cy="0" r="6" fill="var(--yellow)"/>
        <circle cx="11" cy="0" r="6" fill="var(--yellow)"/>
        <circle cx="0" cy="0" r="5" fill="var(--red)"/>
      </g>
    </g>

    <!-- トラック(もの)アイコン: Lucide "truck" (ISC License) -->
    <g class="flow-icon-mono" transform="translate(178,18) scale(1.9)">
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" pathLength="100"/>
      <path d="M15 18H9" pathLength="100"/>
      <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" pathLength="100"/>
      <circle cx="17" cy="18" r="2" pathLength="100"/>
      <circle cx="7" cy="18" r="2" pathLength="100"/>
    </g>

    <!-- 波線(情報)アイコン: Lucide "waves" (ISC License) -->
    <g class="flow-icon-info" transform="translate(462,24) scale(1.4)">
      <path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      <path d="M2 19q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      <path d="M2 5q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
    </g>

    <!-- スウォッシュ -->
    <path class="swoosh" pathLength="100" d="M600,205 L640,120" />

    <text y="172">
      <tspan class="w-mono"   x="150" font-size="58">もの</tspan>
      <tspan class="w-to"     x="266" font-size="34" dy="8">と</tspan>
      <tspan class="w-joho"   x="300" dy="-8" font-size="58">情報</tspan>
      <tspan class="w-no"     x="416" dy="8" font-size="34">の</tspan>
      <tspan class="w-nagare" x="450" dy="-8" font-size="58">流れ</tspan>
    </text>
  </svg>
</div>
</body>
</html>
