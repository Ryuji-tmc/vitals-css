<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>8BIT NYANKO — logo</title>
<link rel="stylesheet" href="../nyanko-8bit.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    min-height: 100vh; background: var(--nk-bg);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Press2P', monospace;
    color: var(--nk-white);
  }
  .screen {
    position: relative;
    width: min(94vw, 640px); aspect-ratio: 16/10;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--nk-bg2) 0%, var(--nk-bg) 70%);
    border: 6px solid var(--nk-line);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 3px #000, 0 24px 60px -20px rgba(0,0,0,0.7);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 18px;
    padding: 20px;
  }

  .topbar {
    position:absolute; top:10px; left:14px; right:14px;
    display:flex; justify-content:space-between;
    font-size: 8px; color: var(--nk-yellow); letter-spacing: 0.05em;
    opacity:0;
  }

  .stars { position:absolute; inset:0; opacity:.6; }
  .star { position:absolute; width:2px; height:2px; background:#fff; opacity:.7; }

  .cat-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 72px; height: 64px;
    gap: 0;
  }
  .cat-grid i.on { background: var(--nk-pink); }
  .cat-grid i.on2 { background: var(--nk-white); }
  .cat-grid i.on3 { background: #241040; }

  .title-row { display:flex; gap:6px; }
  .title {
    font-size: clamp(20px, 5vw, 32px);
    line-height: 1.6;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
  }
  .title .ch { display:inline-block; opacity:0; transform: translateY(6px); color: var(--nk-cyan); }
  .title .ch.n2 { color: var(--nk-pink); }

  .press-start { font-size: 10px; opacity:0; }

  .hearts-row { display:flex; gap:6px; opacity:0; }

  .hiscore { position:absolute; bottom:10px; left:14px; right:14px; display:flex; justify-content:space-between; font-size:8px; color: var(--nk-sub); opacity:0; }
  .hiscore b { color: var(--nk-white); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .topbar, .title .ch, .press-start, .hearts-row, .hiscore { opacity:1 !important; transform:none !important; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .topbar { animation: fade .4s .1s forwards; }
    .title .ch { animation: rise .4s cubic-bezier(.2,.8,.2,1) forwards; }
    .press-start { animation: fade .4s 2.6s forwards; }
    .hearts-row { animation: fade .4s 2.8s forwards; }
    .hiscore { animation: fade .4s 3s forwards; }
  }
  @keyframes fade { to { opacity:1; } }
  @keyframes rise { to { opacity:1; transform:translateY(0); } }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.9} }
</style>
</head>
<body>
<div class="screen pixel-crt glitch" id="screen">
  <div class="stars" id="stars"></div>

  <div class="topbar"><span>1UP  000</span><span>HI-SCORE</span></div>

  <div class="cat-wrap">
    <div class="cat-grid" id="catGrid"></div>
    <div class="title-row" id="titleRow"></div>
    <button class="press-start pixel-btn" id="startBtn">▲ PRESS START ▲</button>
  </div>

  <div class="hearts-row">
    <span class="pixel-lives" data-hp="3" id="livesEl"></span>
  </div>
  <div class="hiscore"><span>NYANKO SOFT</span><span>(C)2026 <b id="scoreVal">000000</b></span></div>
</div>

<script>
  // 星の散りばめ
  const stars = document.getElementById('stars');
  for (let i=0;i<26;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animation=`twinkle ${1.5+Math.random()*2}s ease-in-out ${Math.random()*2}s infinite`;
    stars.appendChild(s);
  }

  // 猫ドット絵(9x8。A=濃紺の輪郭/目 B=白い顔 C=ピンクの鼻、0=透明)
  const rows = [
    "0A00000A0",
    "AAA000AAA",
    "ACAA0AACA",
    "ABBBBBBBA",
    "ABABBBABA",
    "ABBBCBBBA",
    "ABBBBBBBA",
    "0AAAAAAA0",
  ];
  const grid = document.getElementById('catGrid');
  const cells = [];
  rows.forEach((row)=>{
    [...row].forEach((c)=>{
      const el = document.createElement('i');
      el.classList.add('pixel-cell');
      if (c==='A') el.classList.add('on3');
      if (c==='B') el.classList.add('on2');
      if (c==='C') el.classList.add('on');
      grid.appendChild(el);
      cells.push(el);
    });
  });
  cells.forEach((el,i)=>{
    setTimeout(()=>{ el.classList.add('seq'); }, 300 + i*10);
  });

  // タイトル文字を1文字ずつ
  const titleRow = document.getElementById('titleRow');
  const text = "8BIT NYANKO";
  [...text].forEach((ch,i)=>{
    const span = document.createElement('span');
    span.className = 'title ch' + (i % 2 === 0 ? '' : ' n2');
    if (ch === ' ') {
      span.style.width = '18px';
    } else {
      span.textContent = ch;
    }
    span.style.animationDelay = (1.3 + i*0.06) + 's';
    titleRow.appendChild(span);
  });

  // ハート(ライフ) — nyanko-8bit.css の .pixel-lives コンポーネントを使用
  const heartPattern = [
    "0110011",
    "1111111",
    "1111111",
    "0111110",
    "0011100",
    "0001000",
  ];
  function renderHearts(count){
    const wrap = document.getElementById('livesEl');
    wrap.innerHTML = '';
    for (let h=0; h<3; h++){
      const hg = document.createElement('div');
      hg.className='heart-grid';
      heartPattern.forEach(row=>{
        [...row].forEach(c=>{
          const i = document.createElement('i');
          if (c==='1' && h < count) i.classList.add('on');
          hg.appendChild(i);
        });
      });
      wrap.appendChild(hg);
    }
  }
  renderHearts(3);

  // PRESS STARTボタンを押すとライフが減っていくデモ(pixel-livesの状態遷移を見せる)
  let hp = 3;
  document.getElementById('startBtn').addEventListener('click', () => {
    hp = hp > 0 ? hp - 1 : 3;
    document.getElementById('livesEl').dataset.hp = hp;
    renderHearts(hp);
  });

  // スコアカウントアップ
  const scoreEl = document.getElementById('scoreVal');
  let score = 0;
  const target = 84600;
  setTimeout(function tick(){
    score += Math.ceil(target/40);
    if (score >= target) { score = target; scoreEl.textContent = String(score).padStart(6,'0'); return; }
    scoreEl.textContent = String(score).padStart(6,'0');
    setTimeout(tick, 40);
  }, 3000);
</script>
</body>
</html>
