<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vitals. — ロゴアニメーション</title>
<style>
  :root {
    --bg: #0b0d14;
    --ink: #e6e8ef;
    --sub: #8b8fa3;
    --a1: #818cf8;
    --a2: #a855f7;
    --cycle: 6s;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .stage { width: min(92vw, 560px); }
  svg { width: 100%; height: auto; overflow: visible; }

  /* ---- 1. アイコン(心拍ライン)の描画 ---- */
  .icon-path {
    fill: none;
    stroke: url(#gradAccent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: icon-draw var(--cycle) infinite;
  }
  @keyframes icon-draw {
    0%   { stroke-dashoffset: 100; opacity: 1; transform: scale(1); }
    16%  { stroke-dashoffset: 0;   opacity: 1; transform: scale(1); }
    24%  { stroke-dashoffset: 0;   opacity: 1; transform: scale(1); }
    32%  { stroke-dashoffset: 0;   opacity: 0; transform: scale(0.85); }
    100% { stroke-dashoffset: 0;   opacity: 0; transform: scale(0.85); }
  }

  /* ---- 2. ロゴ本体(手書き文字)の"揺れ落ち着き"演出 ---- */
  .wordmark {
    font-family: "Segoe Script", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
    font-size: 64px;
    fill: url(#gradAccent);
    opacity: 0;
    filter: blur(6px);
    animation: word-settle var(--cycle) infinite;
    transform-origin: center;
  }
  @keyframes word-settle {
    0%, 24%  { opacity: 0; filter: blur(6px); transform: translate(0px, 0px) rotate(0deg); }
    27%      { opacity: 0.5; filter: blur(4px); transform: translate(-6px, 4px) rotate(-4deg); }
    30%      { opacity: 0.8; filter: blur(2px); transform: translate(5px, -3px) rotate(3deg); }
    33%      { opacity: 1;   filter: blur(0px); transform: translate(-2px, 2px) rotate(-1deg); }
    36%, 86% { opacity: 1;   filter: blur(0px); transform: translate(0px, 0px) rotate(0deg); }
    94%,100% { opacity: 0;   filter: blur(3px); transform: translate(0px, 6px) rotate(1deg); }
  }

  /* ---- 3. 装飾アーチ(ハートモニターの山を模した左右のフレア) ---- */
  .arc-path {
    fill: none;
    stroke: var(--a2);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    opacity: 0;
    animation: arc-draw var(--cycle) infinite;
  }
  @keyframes arc-draw {
    0%, 32%  { stroke-dashoffset: 100; opacity: 0; }
    44%      { stroke-dashoffset: 0;   opacity: 1; }
    88%      { stroke-dashoffset: 0;   opacity: 1; }
    96%,100% { stroke-dashoffset: 0;   opacity: 0; }
  }

  /* ---- 4. 両脇のティックマーク(モーション感の装飾) ---- */
  .tick {
    stroke: var(--a1);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0;
    transform-origin: center;
    animation: tick-pop var(--cycle) infinite;
  }
  @keyframes tick-pop {
    0%, 36%  { opacity: 0; transform: scale(0.4); }
    42%      { opacity: 1; transform: scale(1.15); }
    46%, 86% { opacity: 1; transform: scale(1); }
    94%,100% { opacity: 0; transform: scale(0.4); }
  }
  .tick:nth-child(2) { animation-delay: 0.05s; }
  .tick:nth-child(3) { animation-delay: 0.1s; }

  /* ---- 5. "i"の点 = 心拍パルスドット ---- */
  .pulse-dot { opacity: 0; animation: dot-appear var(--cycle) infinite; }
  @keyframes dot-appear {
    0%, 33%  { opacity: 0; }
    38%, 88% { opacity: 1; }
    94%,100% { opacity: 0; }
  }
  .pulse-dot circle { animation: dot-beat 1.1s ease-in-out infinite; transform-origin: center; }
  @keyframes dot-beat {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.6); }
    50% { transform: scale(1); }
  }

  /* ---- 6. サブタイトル ---- */
  .subtitle {
    font-size: 14px;
    letter-spacing: 0.25em;
    fill: var(--sub);
    text-transform: uppercase;
    opacity: 0;
    animation: sub-fade var(--cycle) infinite;
  }
  @keyframes sub-fade {
    0%, 44%  { opacity: 0; transform: translateY(8px); }
    52%, 86% { opacity: 1; transform: translateY(0px); }
    94%,100% { opacity: 0; transform: translateY(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .icon-path, .wordmark, .arc-path, .tick, .pulse-dot, .pulse-dot circle, .subtitle {
      animation: none !important;
    }
    .icon-path { opacity: 0; }
    .wordmark, .arc-path, .tick, .pulse-dot, .subtitle { opacity: 1; filter: none; transform: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--a1)"/>
        <stop offset="100%" stop-color="var(--a2)"/>
      </linearGradient>
    </defs>

    <!-- 1. 心拍アイコン(先に描かれ、消える) -->
    <path class="icon-path" pathLength="100"
      d="M70,150 L150,150 L172,105 L196,180 L216,120 L232,150 L390,150" />

    <!-- 3. 左右の装飾アーチ(ハートモニターの山をモチーフに) -->
    <path class="arc-path" pathLength="100" d="M60,130 Q95,35 135,120" />
    <path class="arc-path" pathLength="100" d="M325,120 Q365,35 400,130" />

    <!-- 4. 両脇のティックマーク -->
    <g>
      <line class="tick" x1="24" y1="150" x2="42" y2="150" />
      <line class="tick" x1="22" y1="130" x2="38" y2="122" />
      <line class="tick" x1="22" y1="170" x2="38" y2="178" />

      <line class="tick" x1="436" y1="150" x2="418" y2="150" />
      <line class="tick" x1="438" y1="130" x2="422" y2="122" />
      <line class="tick" x1="438" y1="170" x2="422" y2="178" />
    </g>

    <!-- 2. ロゴ本体 -->
    <text class="wordmark" x="230" y="150" text-anchor="middle">vitals.</text>

    <!-- 5. iの点 = パルスドット(vとaの間、"i"のドット位置に合わせる) -->
    <g class="pulse-dot">
      <circle cx="193" cy="96" r="7" fill="var(--a2)" />
    </g>

    <!-- 6. サブタイトル -->
    <text class="subtitle" x="230" y="188" text-anchor="middle">CSS · Zero-Dependency Motion</text>
  </svg>
</div>
</body>
</html>
