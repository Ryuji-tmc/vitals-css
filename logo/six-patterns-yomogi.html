<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ものと情報の流れ — 6パターン比較(Yomogiフォント)</title>
<style>
  @font-face {
    font-family: 'Yomogi';
    src: url('../fonts/Yomogi-Regular.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    --blue: #3b82f6;
    --red: #ef4444;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e7e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    padding: 32px 20px 60px;
  }
  h1 { text-align: center; font-size: 1.3rem; color: #33364a; margin-bottom: 4px; }
  p.lead { text-align: center; color: #7a7d92; font-size: 0.9rem; margin-top: 0; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    max-width: 1080px;
    margin: 0 auto;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    aspect-ratio: 16 / 9.2;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(20,20,30,0.08);
  }
  .card svg { width: 88%; height: auto; overflow: visible; }
  .label {
    position: absolute; top: 12px; left: 16px;
    font-size: 12px; letter-spacing: 0.04em; font-weight: 600;
  }
  text { font-family: 'Yomogi', "Hiragino Maru Gothic ProN", sans-serif; font-weight: 400; }
  .flow-dot { animation: dot-travel linear infinite; }
  @keyframes dot-travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  /* ============ Pattern 1: 手書き×ネオン(ダーク) ============ */
  .c1 { background: #0b0d14; }
  .c1 .label { color: #6b7086; }
  .p1-mono, .p1-joho { filter: blur(5px); opacity: 0; }
  .p1-mono { fill: var(--blue); animation: p1-settle-mono 6s infinite; }
  .p1-joho { fill: var(--red); animation: p1-settle-joho 6s infinite; }
  @keyframes p1-settle-mono {
    0%,15% { opacity:0; filter:blur(5px); transform:translate(-5px,3px) rotate(-4deg); }
    17% { opacity:.6; filter:blur(2px); transform:translate(3px,-2px) rotate(3deg); }
    19%,84% { opacity:1; filter:blur(0); transform:translate(0,0) rotate(0); }
    92%,100% { opacity:0; filter:blur(2px); transform:translate(0,3px) rotate(1deg); }
  }
  @keyframes p1-settle-joho {
    0%,21% { opacity:0; filter:blur(5px); transform:translate(-5px,3px) rotate(-4deg); }
    23% { opacity:.6; filter:blur(2px); transform:translate(3px,-2px) rotate(3deg); }
    25%,84% { opacity:1; filter:blur(0); transform:translate(0,0) rotate(0); }
    92%,100% { opacity:0; filter:blur(2px); transform:translate(0,3px) rotate(1deg); }
  }
  .p1-to, .p1-no, .p1-nagare { stroke:#11131a; stroke-width:1.1; paint-order:stroke fill; opacity:0; }
  .p1-to, .p1-no { animation: p1-out-y 6s infinite; }
  .p1-nagare { animation: p1-out-b 6s infinite; }
  @keyframes p1-out-y {
    0%,27% { opacity:0; fill:#fff; }
    30% { opacity:1; fill:#fff; }
    35%,84% { opacity:1; fill:var(--yellow); }
    92%,100% { opacity:0; fill:var(--yellow); }
  }
  @keyframes p1-out-b {
    0%,27% { opacity:0; fill:#fff; }
    30% { opacity:1; fill:#fff; }
    35%,84% { opacity:1; fill:var(--blue); }
    92%,100% { opacity:0; fill:var(--blue); }
  }
  .p1-truck > * { fill:none; stroke:var(--blue); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p1-truck-draw 6s infinite; }
  @keyframes p1-truck-draw { 0%,16%{stroke-dashoffset:100;opacity:0;} 22%{stroke-dashoffset:0;opacity:1;} 84%{stroke-dashoffset:0;opacity:1;} 92%,100%{stroke-dashoffset:0;opacity:0;} }
  .p1-wave > * { fill:none; stroke:var(--red); stroke-width:2; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p1-wave-draw 6s infinite; }
  @keyframes p1-wave-draw { 0%,20%{stroke-dashoffset:100;opacity:0;} 26%{stroke-dashoffset:0;opacity:1;} 84%{stroke-dashoffset:0;opacity:1;} 92%,100%{stroke-dashoffset:0;opacity:0;} }
  .p1-swoosh { fill:none; stroke:#cbd0dc; stroke-width:2; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p1-swoosh-draw 6s infinite; }
  @keyframes p1-swoosh-draw { 0%,27%{stroke-dashoffset:100;opacity:0;} 33%{stroke-dashoffset:0;opacity:1;} 40%,100%{stroke-dashoffset:0;opacity:0;} }

  /* ============ Pattern 2: 手書き×暖色(クリーム) ============ */
  .c2 { background: #fdf6ec; }
  .c2 .label { color: #b6a58e; }
  .p2-ink { --ink:#4a4038; }
  .p2-arc { fill:none; stroke:#4a4038; stroke-width:2; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p2-frame 6s infinite; }
  .p2-whisker { stroke:#4a4038; stroke-width:1.6; stroke-linecap:round; opacity:0; transform-origin:center; animation:p2-pop 6s infinite; }
  @keyframes p2-frame { 0%,19%{stroke-dashoffset:100;opacity:0;} 25%{stroke-dashoffset:0;opacity:.7;} 84%{stroke-dashoffset:0;opacity:.7;} 92%,100%{stroke-dashoffset:0;opacity:0;} }
  @keyframes p2-pop { 0%,19%{opacity:0;transform:scale(.4);} 25%{opacity:.7;transform:scale(1.1);} 27%,84%{opacity:.7;transform:scale(1);} 92%,100%{opacity:0;transform:scale(.4);} }
  .p2-flower { opacity:0; animation:p2-flower-in 6s infinite; transform-origin:center; }
  @keyframes p2-flower-in { 0%,27%{opacity:0;transform:scale(.5) rotate(-20deg);} 31%{opacity:1;transform:scale(1) rotate(0);} 31%,84%{opacity:1;} 92%,100%{opacity:0;} }
  .p2-flower g { animation: p2-sway 2.2s ease-in-out infinite; transform-origin:center; }
  @keyframes p2-sway { 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  .p2-mono, .p2-joho { filter:blur(5px); opacity:0; }
  .p2-mono { fill:#5b7fd6; animation:p1-settle-mono 6s infinite; }
  .p2-joho { fill:#e8695a; animation:p1-settle-joho 6s infinite; }
  .p2-to, .p2-no, .p2-nagare { stroke:#4a4038; stroke-width:1.1; paint-order:stroke fill; opacity:0; }
  .p2-to, .p2-no { animation:p2-out-y 6s infinite; }
  .p2-nagare { animation:p2-out-b 6s infinite; }
  @keyframes p2-out-y { 0%,27%{opacity:0;fill:#fffaf1;} 30%{opacity:1;fill:#fffaf1;} 35%,84%{opacity:1;fill:#dda029;} 92%,100%{opacity:0;fill:#dda029;} }
  @keyframes p2-out-b { 0%,27%{opacity:0;fill:#fffaf1;} 30%{opacity:1;fill:#fffaf1;} 35%,84%{opacity:1;fill:#5b7fd6;} 92%,100%{opacity:0;fill:#5b7fd6;} }
  .p2-truck > * { fill:none; stroke:#5b7fd6; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p1-truck-draw 6s infinite; }
  .p2-wave > * { fill:none; stroke:#e8695a; stroke-width:1.8; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; animation:p1-wave-draw 6s infinite; }

  /* ============ Pattern 3: フロー図解(矢印で一本道) ============ */
  .c3 { background: #ffffff; }
  .c3 .label { color: #b9bcc8; }
  .p3-el { opacity:0; }
  .p3-1 { animation: p3-a 6s infinite; }
  .p3-2 { animation: p3-b 6s infinite; }
  .p3-3 { animation: p3-c 6s infinite; }
  .p3-4 { animation: p3-d 6s infinite; }
  .p3-5 { animation: p3-e 6s infinite; }
  .p3-6 { animation: p3-f 6s infinite; }
  .p3-7 { animation: p3-g 6s infinite; }
  .p3-8 { animation: p3-h 6s infinite; }
  .p3-9 { animation: p3-i 6s infinite; }
  @keyframes p3-a { 0%,4%{opacity:0;transform:translateX(-6px);} 9%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-b { 0%,9%{opacity:0;} 14%{opacity:1;} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-c { 0%,14%{opacity:0;transform:translateX(-6px);} 19%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-d { 0%,19%{opacity:0;transform:translateX(-6px);} 23%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-e { 0%,23%{opacity:0;transform:translateX(-6px);} 29%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-f { 0%,29%{opacity:0;transform:translateX(-6px);} 33%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-g { 0%,33%{opacity:0;transform:translateX(-6px);} 38%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-h { 0%,38%{opacity:0;} 43%{opacity:1;} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p3-i { 0%,43%{opacity:0;transform:translateX(-6px);} 48%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  .p3-arrow { fill:none; stroke:#9aa0b3; stroke-width:2.4; stroke-linecap:round; }
  .p3-icon { fill:none; stroke:#5a5f72; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .p3-mono { fill: var(--blue); }
  .p3-joho { fill: var(--red); }
  .p3-nagare { fill: var(--blue); }
  .p3-to, .p3-no { fill: var(--yellow); }

  /* ============ Pattern 4: ミニマル(社内向け) ============ */
  .c4 { background: #f7f7f9; }
  .c4 .label { color: #b3b6c2; }
  .p4-word { fill:#33364a; opacity:0; animation: p4-fade 5s infinite; }
  .p4-word.p4-d1 { animation-delay: 0s; }
  .p4-word.p4-d2 { animation-delay: .15s; }
  .p4-word.p4-d3 { animation-delay: .3s; }
  .p4-word.p4-d4 { animation-delay: .45s; }
  .p4-word.p4-d5 { animation-delay: .6s; }
  @keyframes p4-fade { 0%{opacity:0; transform:translateY(8px);} 8%{opacity:1; transform:translateY(0);} 82%{opacity:1;} 92%,100%{opacity:0;} }
  .p4-underline { stroke-dasharray:100; stroke-dashoffset:100; opacity:0; stroke-width:3; stroke-linecap:round; animation: p4-line 5s infinite; }
  .p4-underline.blue { stroke: var(--blue); }
  .p4-underline.red { stroke: var(--red); }
  @keyframes p4-line { 0%,20%{stroke-dashoffset:100;opacity:0;} 30%{stroke-dashoffset:0;opacity:1;} 82%{stroke-dashoffset:0;opacity:1;} 92%,100%{stroke-dashoffset:0;opacity:0;} }
  .p4-icon { fill:none; stroke:#7d8296; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:0; animation: p4-icon-in 5s infinite; }
  @keyframes p4-icon-in { 0%,34%{opacity:0;transform:translateY(4px);} 42%{opacity:1;transform:translateY(0);} 82%{opacity:1;} 92%,100%{opacity:0;} }
  .p4-caption { fill:#a2a6b6; font-size:9px; letter-spacing:.12em; font-weight:600; opacity:0; animation: p4-icon-in 5s infinite; }

  /* ============ Pattern 5: タイムライン(下線が伸びる) ============ */
  .c5 { background: #ffffff; }
  .c5 .label { color: #b9bcc8; }
  .p5-bar { transform: scaleX(0); transform-origin: left; stroke: #d8dae2; stroke-width: 4; stroke-linecap: round; animation: p5-grow 6s infinite; }
  @keyframes p5-grow { 0%,6%{transform:scaleX(0);} 48%{transform:scaleX(1);} 84%{transform:scaleX(1);} 92%,100%{transform:scaleX(0);} }
  .p5-word { fill: #c7c9d4; }
  .p5-mono { animation: p5-mono 6s infinite; }
  .p5-to { animation: p5-to 6s infinite; }
  .p5-joho { animation: p5-joho 6s infinite; }
  .p5-no { animation: p5-no 6s infinite; }
  .p5-nagare { animation: p5-nagare 6s infinite; }
  @keyframes p5-mono   { 0%,9%{fill:#c7c9d4;} 11%,84%{fill:var(--blue);} 92%,100%{fill:#c7c9d4;} }
  @keyframes p5-to      { 0%,17%{fill:#c7c9d4;} 19%,84%{fill:var(--yellow);} 92%,100%{fill:#c7c9d4;} }
  @keyframes p5-joho    { 0%,25%{fill:#c7c9d4;} 27%,84%{fill:var(--red);} 92%,100%{fill:#c7c9d4;} }
  @keyframes p5-no      { 0%,37%{fill:#c7c9d4;} 39%,84%{fill:var(--yellow);} 92%,100%{fill:#c7c9d4;} }
  @keyframes p5-nagare  { 0%,43%{fill:#c7c9d4;} 45%,84%{fill:var(--blue);} 92%,100%{fill:#c7c9d4;} }
  .p5-icon { fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
  .p5-icon.truck { stroke: var(--blue); animation: p5-icon-truck 6s infinite; }
  .p5-icon.wave { stroke: var(--red); animation: p5-icon-wave 6s infinite; }
  @keyframes p5-icon-truck { 0%,10%{opacity:0;transform:translateY(4px);} 15%{opacity:1;transform:translateY(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p5-icon-wave  { 0%,26%{opacity:0;transform:translateY(4px);} 31%{opacity:1;transform:translateY(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }

  /* ============ Pattern 6: 二層レーン(VSM風) ============ */
  .c6 { background: #f2f6fb; }
  .c6 .label { color: #a7b0c4; }
  .p6-reveal { opacity:0; animation: p6-fade 6s infinite; }
  .p6-reveal.d1 { animation-name: p6-fade1; }
  .p6-reveal.d2 { animation-name: p6-fade2; }
  .p6-reveal.d3 { animation-name: p6-fade3; }
  @keyframes p6-fade1 { 0%,8%{opacity:0;} 16%{opacity:1;} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p6-fade2 { 0%,20%{opacity:0;transform:translateX(-6px);} 26%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  @keyframes p6-fade3 { 0%,32%{opacity:0;transform:translateX(-6px);} 38%{opacity:1;transform:translateX(0);} 84%{opacity:1;} 92%,100%{opacity:0;} }
  .p6-lane { stroke:#c3cee0; stroke-width:2; stroke-dasharray:5 5; fill:none; }
  .p6-move { animation: p6-slide 2.6s linear infinite; }
  @keyframes p6-slide { 0%{transform:translateX(0);} 100%{transform:translateX(230px);} }
  .p6-truck { fill:none; stroke:var(--blue); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .p6-wave-mini { fill:none; stroke:var(--red); stroke-width:2.2; stroke-linecap:round; }
  .p6-icon-static { fill:none; stroke:#7d8296; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .p6-label-blue { fill: var(--blue); }
  .p6-label-red { fill: var(--red); }
  .p6-label-yellow { fill: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    [class*="p1-"], [class*="p2-"], [class*="p3-"], [class*="p4-"], [class*="p5-"], [class*="p6-"] { opacity: 1 !important; filter:none !important; transform:none !important; }
  }
</style>
</head>
<body>
<h1>ものと情報の流れ — 6パターン</h1>
<p class="lead">同じテーマを6つの見せ方で比較(社内共有・選定用)</p>

<div class="grid">

  <!-- 1: 手書き×ネオン -->
  <div class="card c1">
    <span class="label">1. 手書き×ネオン</span>
    <svg viewBox="0 0 400 190">
      <g class="p1-truck" transform="translate(28,24) scale(1.4)">
        <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" pathLength="100"/>
        <path d="M15 18H9" pathLength="100"/>
        <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" pathLength="100"/>
        <circle cx="17" cy="18" r="2" pathLength="100"/>
        <circle cx="7" cy="18" r="2" pathLength="100"/>
      </g>
      <g class="p1-wave" transform="translate(240,20) scale(1.15)">
        <path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
        <path d="M2 19q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
        <path d="M2 5q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      </g>
      <path class="p1-swoosh" pathLength="100" d="M330,120 L360,70" />
      <text y="115">
        <tspan class="p1-mono" x="30" font-size="30">もの</tspan>
        <tspan class="p1-to" x="94" font-size="18" dy="5">と</tspan>
        <tspan class="p1-joho" x="120" dy="-5" font-size="30">情報</tspan>
        <tspan class="p1-no" x="182" dy="5" font-size="18">の</tspan>
        <tspan class="p1-nagare" x="206" dy="-5" font-size="30">流れ</tspan>
      </text>
    </svg>
  </div>

  <!-- 2: 手書き×暖色 -->
  <div class="card c2">
    <span class="label">2. 手書き×暖色</span>
    <svg viewBox="0 0 400 190">
      <path class="p2-arc" pathLength="100" d="M110,110 Q150,20 190,105" />
      <path class="p2-arc" pathLength="100" d="M215,105 Q255,20 295,110" />
      <g>
        <line class="p2-whisker" x1="60" y1="95" x2="95" y2="90" />
        <line class="p2-whisker" x1="60" y1="108" x2="97" y2="110" />
        <line class="p2-whisker" x1="60" y1="121" x2="95" y2="128" />
        <line class="p2-whisker" x1="340" y1="90" x2="305" y2="95" />
        <line class="p2-whisker" x1="340" y1="110" x2="303" y2="108" />
        <line class="p2-whisker" x1="340" y1="128" x2="305" y2="121" />
      </g>
      <g class="p2-flower" transform="translate(200,58)">
        <g>
          <circle cx="0" cy="-8" r="4.5" fill="#dda029"/>
          <circle cx="0" cy="8" r="4.5" fill="#dda029"/>
          <circle cx="-8" cy="0" r="4.5" fill="#dda029"/>
          <circle cx="8" cy="0" r="4.5" fill="#dda029"/>
          <circle cx="0" cy="0" r="3.6" fill="#e8695a"/>
        </g>
      </g>
      <g class="p2-truck" transform="translate(28,24) scale(1.4)">
        <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" pathLength="100"/>
        <path d="M15 18H9" pathLength="100"/>
        <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" pathLength="100"/>
        <circle cx="17" cy="18" r="2" pathLength="100"/>
        <circle cx="7" cy="18" r="2" pathLength="100"/>
      </g>
      <g class="p2-wave" transform="translate(240,20) scale(1.15)">
        <path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
        <path d="M2 19q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
        <path d="M2 5q2.5 2 5 0t5 0 5 0 5 0" pathLength="100"/>
      </g>
      <text y="115">
        <tspan class="p2-mono" x="30" font-size="30">もの</tspan>
        <tspan class="p2-to" x="94" font-size="18" dy="5">と</tspan>
        <tspan class="p2-joho" x="120" dy="-5" font-size="30">情報</tspan>
        <tspan class="p2-no" x="182" dy="5" font-size="18">の</tspan>
        <tspan class="p2-nagare" x="206" dy="-5" font-size="30">流れ</tspan>
      </text>
    </svg>
  </div>

  <!-- 3: フロー図解 -->
  <div class="card c3">
    <span class="label">3. フロー図解</span>
    <svg viewBox="0 0 440 190">
      <g class="p3-el p3-1 p3-icon" transform="translate(4,66) scale(1.3)">
        <path d="M12 16h.01"/>
        <path d="M16 16h.01"/>
        <path d="M3 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a.5.5 0 0 0-.769-.422l-4.462 2.844A.5.5 0 0 1 15 10.5v-2a.5.5 0 0 0-.769-.422L9.77 10.922A.5.5 0 0 1 9 10.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/>
        <path d="M8 16h.01"/>
      </g>
      <g class="p3-el p3-2">
        <path class="p3-arrow" d="M44,85 L66,85"/>
        <circle class="flow-dot" r="3" fill="var(--blue)" style="offset-path:path('M44,85 L66,85'); animation-duration:1s;"/>
      </g>
      <text class="p3-el p3-3 p3-mono" x="70" y="93" font-size="26">もの</text>
      <text class="p3-el p3-4 p3-to" x="122" y="93" font-size="16">と</text>
      <g class="p3-el p3-5 p3-icon" transform="translate(152,48) scale(1.1)">
