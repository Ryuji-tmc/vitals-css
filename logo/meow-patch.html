  :root {
    --bg: #1b1626;
    --panel: #241d33;
    --line: #362b4a;
    --pink: #ff8fc0;
    --violet: #9b7bff;
    --green: #7ee787;
    --yellow: #ffd479;
    --red: #ff8fa0;
    --ink: #eee7fb;
    --sub: #9d94b8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    min-height: 100vh; background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: 'SpaceMono', monospace; color: var(--ink);
  }
  .card {
    position: relative;
    width: min(94vw, 460px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 26px 22px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  }

  .top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; opacity:0; }
  .version { font-size: 12px; color: var(--sub); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
  .live { display:flex; align-items:center; gap:6px; font-size:11px; color: var(--green); letter-spacing:.05em; }
  .live .dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation: blink 1.4s ease-in-out infinite; }

  .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: var(--sub); margin-bottom: 6px; opacity:0; }

  .title {
    font-family:'MPlusRounded'; font-weight:900;
    font-size: clamp(30px, 8vw, 42px); line-height:1;
    margin: 0 0 18px; transform: scale(0.6); opacity:0;
  }
  .title .m { color: var(--pink); }
  .title .p { color: var(--violet); }

  .stamp {
    position:absolute; top:58px; right:22px;
    width:64px; height:64px; border-radius:50%;
    border: 3px solid var(--pink);
    display:flex; align-items:center; justify-content:center;
    transform: rotate(-14deg) scale(0);
    opacity: 0;
  }
  .stamp span {
    font-family:'SpaceMono'; font-weight:700; font-size:8px; letter-spacing:.06em;
    color: var(--pink); text-align:center; line-height:1.3;
  }

  .notes { display:flex; flex-direction:column; gap:9px; margin-bottom: 18px; }
  .note { display:flex; gap:8px; font-size:12.5px; opacity:0; transform: translateX(-8px); }
  .note .tag { flex-shrink:0; font-weight:700; }
  .note.add .tag { color: var(--green); }
  .note.balance .tag { color: var(--yellow); }
  .note.fix .tag { color: var(--red); }
  .note .body { color: var(--ink); }
  .note .body b { color: var(--sub); font-weight:400; }

  .progress-wrap { opacity:0; }
  .progress-label { display:flex; justify-content:space-between; font-size:11px; color: var(--sub); margin-bottom:6px; }
  .progress-label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar-track { height:8px; border-radius:4px; background: var(--line); overflow:hidden; }
  .bar-fill { height:100%; width:0%; border-radius:4px; background: linear-gradient(90deg, var(--pink), var(--violet)); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .top-row, .eyebrow, .title, .stamp, .note, .progress-wrap { opacity:1 !important; transform:none !important; }
    .bar-fill { width: 100% !important; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .top-row { animation: fade .4s .1s forwards; }
    .eyebrow { animation: fade .4s .3s forwards; }
    .title { animation: pop .5s .45s cubic-bezier(.34,1.56,.64,1) forwards; }
    .stamp { animation: stamp-in .45s .95s cubic-bezier(.34,1.56,.64,1) forwards; }
    .note { animation: slide-in .4s cubic-bezier(.2,.8,.2,1) forwards; }
    .note:nth-child(1){ animation-delay: 1.25s; }
    .note:nth-child(2){ animation-delay: 1.4s; }
    .note:nth-child(3){ animation-delay: 1.55s; }
    .progress-wrap { animation: fade .4s 1.8s forwards; }
  }
  @keyframes fade { to { opacity:1; } }
  @keyframes pop { to { opacity:1; transform: scale(1); } }
  @keyframes stamp-in { to { opacity:1; transform: rotate(-14deg) scale(1); } }
  @keyframes slide-in { to { opacity:1; transform: translateX(0); } }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
<div class="card meow-pawswipe">
  <span class="meow-tax" style="right:auto; left:16px;">CAT TAX: PAID</span>

  <div class="top-row">
    <span class="version">v1.0.4</span>
    <span class="meow-status" data-mood="loaf" id="moodStatus">
      <svg viewBox="0 0 24 24">
        <g class="pose pose-loaf">
          <ellipse cx="12" cy="15" rx="9" ry="6.5"/>
          <polygon points="4,10 7.5,10 5.5,4"/>
          <polygon points="20,10 16.5,10 18.5,4"/>
          <path d="M8,14 q1.5,-2 3,0" stroke="#1b1626" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M13,14 q1.5,-2 3,0" stroke="#1b1626" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </g>
        <g class="pose pose-alert">
          <path d="M3,21 Q6,5 12,10 Q18,5 21,21 Z"/>
          <polygon points="4,8 7,8 4.5,1"/>
          <polygon points="20,8 17,8 19.5,1"/>
          <circle cx="9" cy="14" r="1.8" fill="#1b1626"/>
          <circle cx="15" cy="14" r="1.8" fill="#1b1626"/>
        </g>
        <g class="pose pose-sleep">
          <path d="M2,15 Q12,21 22,15 Q12,9 2,15 Z"/>
          <path d="M7,14 h3" stroke="#1b1626" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M14,14 h3" stroke="#1b1626" stroke-width="1.4" stroke-linecap="round"/>
          <text class="zzz" x="17" y="7" font-size="6">z</text>
          <text class="zzz" x="20" y="3" font-size="5">z</text>
        </g>
      </svg>
      <span class="label" id="moodLabel">OPERATIONAL</span>
    </span>
  </div>

  <div class="eyebrow">PATCH NOTES</div>
  <h1 class="title"><span class="m">Meow</span> <span class="p">Patch</span></h1>

  <div class="stamp"><span>NYAN<br>APPROVED</span></div>

  <div class="notes">
    <div class="note add"><span class="tag">[+]</span><span class="body">ADDED: <b>unlimited naps</b></span></div>
    <div class="note balance"><span class="tag">[~]</span><span class="body">BALANCE: <b>purring volume increased</b></span></div>
    <div class="note fix"><span class="tag">[x]</span><span class="body">FIXED: <b>3am zoomies bug</b></span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label"><span id="progLabel">INSTALLING PATCH...</span><b id="progVal">0%</b></div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <p class="meow-caption mock" style="font-size:13px; margin-top:16px;">sUcH fIx. mUcH wOw. vErY pAtCh.</p>
</div>

<div class="mood-demo" style="display:flex; gap:8px; justify-content:center; margin-top:18px;">
  <button data-set-mood="loaf" class="mood-btn">😽 Loaf</button>
  <button data-set-mood="alert" class="mood-btn">🙀 Alert</button>
  <button data-set-mood="sleep" class="mood-btn">😴 Sleep</button>
</div>
<style>
  .mood-btn {
    font-family: 'SpaceMono', monospace; font-size: 11px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .mood-btn:hover { border-color: var(--pink); }
</style>

<script>
  const bar = document.getElementById('barFill');
  const val = document.getElementById('progVal');
  const label = document.getElementById('progLabel');
  function runInstall(){
    let p = 0;
    label.textContent = 'INSTALLING PATCH...';
    const timer = setInterval(()=>{
      p += 3 + Math.random()*4;
      if (p >= 100) {
        p = 100;
        clearInterval(timer);
        bar.style.width = '100%';
        val.textContent = '100%';
        label.textContent = 'READY TO PLAY';
        setTimeout(runInstall, 3200);
        return;
      }
      bar.style.width = p + '%';
      val.textContent = Math.floor(p) + '%';
    }, 90);
  }
  setTimeout(runInstall, 2200);

  const moodLabels = { loaf: 'OPERATIONAL', alert: 'INCIDENT', sleep: 'MAINTENANCE' };
  const moodStatus = document.getElementById('moodStatus');
  const moodLabel = document.getElementById('moodLabel');
  document.querySelectorAll('[data-set-mood]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const mood = btn.dataset.setMood;
      moodStatus.dataset.mood = mood;
      moodLabel.textContent = moodLabels[mood];
    });
  });
</script>
</body>
</html>
